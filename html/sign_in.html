<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign In</title>
  </head>
  <body>
    <main>
      <img src="..\docs\images\coding.png" alt="Cartoon programmer" />
      <h2>Login Now!</h2>
      <form action="sign_in.html">
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          required />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          required />
        <input type="submit" value="Sign In" />
      </form>
      New to CodeCLA?
      <a href="login.html">Sign Up</a>
    </main>
  </body>
</html>
