<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style_sign_up_in.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign In</title>
  </head>
  <body>
    <main>
      <div id="login_img">
        <img src="../docs/images/coding.png" alt="Cartoon programmer" />
      </div>
      <div id="login">
        <h2>Login Now!</h2>
        <form action="sign_in.html">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required />
          <input type="submit" value="Sign In" />
        </form>
        <p>
          New to Code Labs Academy?
          <a href="login.html">Sign Up</a>
        </p>
      </div>
    </main>
  </body>
</html>
